name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0.5"]
        rails: ["8_0", "8_1"]
        exclude:
          - ruby: "4.0.5"
            rails: "8_0"
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/rails app:db:prepare
      - run: bin/rails test

  javascript:
    name: JavaScript bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Committed bundle matches the controllers
        run: |
          git diff --exit-code -- app/assets/javascripts/rails_exception_log/application.js || {
            echo "::error::The prebuilt bundle is out of date. Run 'bun run build' and commit the result."
            exit 1
          }
      - name: Customize generator copies match the controllers
        run: |
          for file in app/javascript/controllers/rails_exception_log*_controller.js; do
            diff -u "$file" "lib/generators/rails_exception_log/templates/javascript/controllers/$(basename "$file")" || {
              echo "::error::Copy $file into lib/generators/rails_exception_log/templates/javascript/controllers/"
              exit 1
            }
          done

  databases:
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            adapter: sqlite3
            name: storage/test.sqlite3
          - database: postgresql
            adapter: postgresql
            name: rails_exception_log_test
            port: 5432
            username: postgres
            password: postgres
          - database: mysql
            adapter: mysql2
            name: rails_exception_log_test
            port: 3306
            username: root
            password: root
          - database: mariadb
            adapter: mysql2
            name: rails_exception_log_test
            port: 3307
            username: root
            password: root
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_exception_log_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rails_exception_log_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval 10s
          --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rails_exception_log_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      BUNDLE_GEMFILE: gemfiles/database.gemfile
      RAILS_ENV: test
      DB_ADAPTER: ${{ matrix.adapter }}
      DB_NAME: ${{ matrix.name }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - run: bin/rails app:db:prepare
      - run: bin/rails test test/models test/controllers test/lib

  assets:
    strategy:
      matrix:
        include:
          - pipeline: sprockets
            gemfile: rails_8_1
          - pipeline: propshaft
            gemfile: propshaft
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      RAILS_ENV: production
      SECRET_KEY_BASE_DUMMY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - run: bin/rails app:assets:precompile

  security:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/tooling.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - run: bundle exec rubocop --cache false
      - run: bundle exec brakeman --no-pager -q -p .
      - run: bundle exec bundle-audit check --update
